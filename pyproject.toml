[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
"app.persistence" = ["migrations/*.sql"]
"app.security" = ["migrations/*.sql"]

[project]
name = "paperpilot-secure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1", "sqlglot==30.24.0"
]

[project.optional-dependencies]
security = ["psycopg[binary]==3.3.6"]
security-test = ["psycopg[binary]==3.3.6", "pypdf==6.21.3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "real_database: requires A's explicit isolated database provider; never runs against Mock",
  "legacy_persistence: historical SQLite experiment, explicitly opt in with --legacy-persistence"
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

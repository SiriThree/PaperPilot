<rect x="70" y="1202" width="2360" height="90" rx="8" class="note-box"/><text x="92" y="1232" class="note">概念合并：PAPER 与 PROJECT_PAPER 合并为“论文”，一次导入对应一份论文元数据，公开 paper_id 仍指项目导入。</text><text x="92" y="1254" class="note">外键画成联系：project_papers.imported_by 改为“用户 —上传— 论文”1:N，不再作为论文属性；EMBEDDING 并入“向量化”联系（K15）。</text><text x="92" y="1276" class="note">作者、主题、向量模型在数据字典中均带非空 project_id（按项目隔离），本图不重复画这些辅助外键；完整字段与索引状态见数据字典。</text>
<line x1="70" y1="1346" x2="2430" y2="1346" class="rule"/><text x="1250" y="1376" text-anchor="middle" class="legend">矩形：实体　椭圆：属性　菱形：联系　实下划线：主键　虚下划线：部分键（与所属实体主键组合）　1 / N / M：最大基数</text>

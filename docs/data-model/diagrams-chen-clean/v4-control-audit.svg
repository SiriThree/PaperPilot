<rect x="70" y="2010" width="1760" height="112" rx="8" class="note-box"/><text x="92" y="2040" class="note">去冗余：outbox 与 audit 只按 event_id 幂等关联，不是强制外键，因此不画“投递为”菱形；审计也可独立追加。</text><text x="92" y="2062" class="note">部分键（虚下划线）：幂等记录 = user_id + project_id + operation + key（所属用户、项目经“提交请求/幂等归属”确定）；执行尝试 = task_id + attempt_no。</text><text x="92" y="2084" class="note">task_results.committed_attempt 画为“执行尝试 —采纳— 研究结果”1:1（每个结果恰好采纳一次尝试）；幂等记录的任务/版本重放外键不重复画成联系。</text><text x="92" y="2106" class="note">基数只标最大值；审计/outbox 的项目、操作者可空（登录事件等），最小参与见数据字典。outbox.actor_id 是可选审计维度，不另画联系。</text>
<line x1="70" y1="2176" x2="1830" y2="2176" class="rule"/><text x="950" y="2206" text-anchor="middle" class="legend">矩形：实体　椭圆：属性　菱形：联系　实下划线：主键　虚下划线：部分键（与所属实体主键组合）　1 / N / M：最大基数</text>
</svg>

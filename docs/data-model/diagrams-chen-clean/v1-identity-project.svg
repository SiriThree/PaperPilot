<rect x="70" y="782" width="1460" height="90" rx="8" class="note-box"/><text x="92" y="812" class="note">模型修正：取消“项目成员”实体，也取消重复的“负责”联系。用户与项目直接用“参与”联系表达多对多；</text><text x="92" y="834" class="note">项目角色、加入时间是联系属性；每个项目恰好一名 role = owner 的成员，负责人不可移除或转让（K02、K03）。</text><text x="92" y="856" class="note">projects.owner_id / owner_role 是复合外键实现，不再作为重复联系或重复属性绘制。</text>
<line x1="70" y1="926" x2="1530" y2="926" class="rule"/><text x="800" y="956" text-anchor="middle" class="legend">矩形：实体　椭圆：属性　菱形：联系　实下划线：主键　虚下划线：部分键（与所属实体主键组合）　1 / N / M：最大基数</text>
</svg>
